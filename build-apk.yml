name: Generar APK de TV Movil

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Preparar repositorio
        uses: actions/checkout@v4

      - name: Crear proyecto movil
        run: |
          printf '%s' '' | base64 --decode > 'App.tsx'
          printf '%s' '' | base64 --decode > 'package.json'
          printf '%s' '' | base64 --decode > 'app.json'
          printf '%s' '' | base64 --decode > 'metro.config.js'
          printf '%s' 'ewogICJleHRlbmRzIjogImV4cG8vdHNjb25maWcuYmFzZSIsCiAgImNvbXBpbGVyT3B0aW9ucyI6IHsKICAgICJzdHJpY3QiOiB0cnVlLAogICAgIm5vRW1pdCI6IHRydWUKICB9LAogICJpbmNsdWRlIjogWwogICAgIioqLyoudHMiLAogICAgIioqLyoudHN4IiwKICAgICIuZXhwby90eXBlcy8qKi8qLnRzIiwKICAgICJleHBvLWVudi5kLnRzIgogIF0KfQo=' | base64 --decode > 'tsconfig.json'
          printf '%s' '' | base64 --decode > 'eslint.config.js'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Movil-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
